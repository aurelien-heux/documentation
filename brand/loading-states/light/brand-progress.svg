<svg xmlns="http://www.w3.org/2000/svg" class="ait-cd" viewBox="-4 2 76 64" width="114" height="96" role="progressbar" aria-valuenow="35" aria-valuemin="0" aria-valuemax="100" style="overflow:visible;--p:35"><style>@keyframes ait-po-spin{to{transform:rotate(360deg)}}
.ait-po{animation:ait-po-spin 1.4s linear infinite;transform-origin:center}
@keyframes ait-gl-run{0%{transform:translateX(-30%)}100%{transform:translateX(105%)}}
.ait-gl-bar{animation:ait-gl-run 1.8s cubic-bezier(.2,0,0,1) infinite}
@keyframes ait-cd-draw{0%,6%{stroke-dashoffset:100}70%,100%{stroke-dashoffset:0}}
@keyframes ait-cd-pen{0%,6%{offset-distance:0%;opacity:1}70%{offset-distance:100%;opacity:1}73%,100%{offset-distance:100%;opacity:0}}
@keyframes ait-cd-fill{0%,72%{opacity:0}78%,100%{opacity:1}}
.ait-cd-loop .ait-cd-line{animation:ait-cd-draw 4s linear infinite}
.ait-cd-loop .ait-cd-pen{animation:ait-cd-pen 4s linear infinite}
.ait-cd-loop .ait-cd-solid{animation:ait-cd-fill 4s linear infinite}
.ait-cd-pen{offset-path:path("M44 22H14a10 10 0 0 0-10 10v16a10 10 0 0 0 10 10h36a10 10 0 0 0 10-10V32a10 10 0 0 0-10-10H44");offset-rotate:0deg}
.ait-cd[style*="--p"] .ait-cd-line{stroke-dashoffset:calc(100 - var(--p))}
.ait-cd[style*="--p"] .ait-cd-pen{offset-distance:calc(var(--p) * 1%)}
.ait-cd[style*="--p"] .ait-cd-solid{opacity:0}
.ait-cd.ait-cd-done .ait-cd-solid{opacity:1}.ait-cd.ait-cd-done .ait-cd-pen{opacity:0}
@keyframes ait-dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.ait-dot{animation:ait-dot 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){.ait-po{animation:none!important}.ait-gl-bar,.ait-dot,.ait-cd-loop *{animation:none!important}.ait-cd-loop .ait-cd-solid{opacity:1}.ait-cd-loop .ait-cd-pen{opacity:0}}</style><rect class="ait-cd-guide" x="4" y="22" width="56" height="36" rx="10" fill="none" stroke="#006A6A" stroke-width="1" stroke-dasharray="2 2" opacity=".45"/><path class="ait-cd-guide" d="M21 23v-6a6 6 0 0 1 6-6h10a6 6 0 0 1 6 6v6" fill="none" stroke="#006A6A" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/><g class="ait-cd-solid"><rect class="ait-cd-body" x="4" y="22" width="56" height="36" rx="10" fill="#0D0B14"/><path class="ait-cd-handle" d="M21 23v-6a6 6 0 0 1 6-6h10a6 6 0 0 1 6 6v6" fill="none" stroke="#0D0B14" stroke-width="6" stroke-linecap="round"/><path class="ait-cd-chev" d="M17.5 33l8 7-8 7" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path class="ait-cd-cur" d="M33.5 47h13" fill="none" stroke="#00F29E" stroke-width="5.5" stroke-linecap="round"/></g><path class="ait-cd-line" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" d="M44 22H14a10 10 0 0 0-10 10v16a10 10 0 0 0 10 10h36a10 10 0 0 0 10-10V32a10 10 0 0 0-10-10H44" fill="none" stroke="#006A6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle class="ait-cd-pen" r="2.6" fill="#006A6A"/><text class="ait-cd-label" x="32" y="43" text-anchor="middle" font-family="Open Sans, sans-serif" font-weight="600" font-size="11" fill="#006A6A">35%</text></svg>