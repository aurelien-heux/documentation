<svg xmlns="http://www.w3.org/2000/svg" class="ait-po-svg" viewBox="0 0 48 48" width="24" height="24" role="img" aria-label="Loading"><style>@keyframes ait-po-spin{to{transform:rotate(360deg)}}
.ait-po{animation:ait-po-spin 1.4s linear infinite;transform-origin:center}
@keyframes ait-gl-run{0%{transform:translateX(-30%)}100%{transform:translateX(105%)}}
.ait-gl-bar{animation:ait-gl-run 1.8s cubic-bezier(.2,0,0,1) infinite}
@keyframes ait-cd-draw{0%,6%{stroke-dashoffset:100}70%,100%{stroke-dashoffset:0}}
@keyframes ait-cd-pen{0%,6%{offset-distance:0%;opacity:1}70%{offset-distance:100%;opacity:1}73%,100%{offset-distance:100%;opacity:0}}
@keyframes ait-cd-fill{0%,72%{opacity:0}78%,100%{opacity:1}}
.ait-cd-loop .ait-cd-line{animation:ait-cd-draw 4s linear infinite}
.ait-cd-loop .ait-cd-pen{animation:ait-cd-pen 4s linear infinite}
.ait-cd-loop .ait-cd-solid{animation:ait-cd-fill 4s linear infinite}
.ait-cd-pen{offset-path:path("M44 22H14a10 10 0 0 0-10 10v16a10 10 0 0 0 10 10h36a10 10 0 0 0 10-10V32a10 10 0 0 0-10-10H44");offset-rotate:0deg}
.ait-cd[style*="--p"] .ait-cd-line{stroke-dashoffset:calc(100 - var(--p))}
.ait-cd[style*="--p"] .ait-cd-pen{offset-distance:calc(var(--p) * 1%)}
.ait-cd[style*="--p"] .ait-cd-solid{opacity:0}
.ait-cd.ait-cd-done .ait-cd-solid{opacity:1}.ait-cd.ait-cd-done .ait-cd-pen{opacity:0}
@keyframes ait-dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.ait-dot{animation:ait-dot 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){.ait-po{animation:none!important}.ait-gl-bar,.ait-dot,.ait-cd-loop *{animation:none!important}.ait-cd-loop .ait-cd-solid{opacity:1}.ait-cd-loop .ait-cd-pen{opacity:0}}</style><circle class="ait-po-track" cx="24" cy="24" r="20" fill="none" stroke="#E3DFFF" stroke-width="5"/><g class="ait-po"><circle class="ait-po-arc" cx="24" cy="24" r="20" fill="none" stroke="#39235F" stroke-width="5" stroke-linecap="round" stroke-dasharray="66 60" transform="rotate(-90 24 24)"/><circle class="ait-po-pen" cx="20.85" cy="43.75" r="4.50" fill="#006A6A"/></g></svg>