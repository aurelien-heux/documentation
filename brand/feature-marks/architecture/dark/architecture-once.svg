<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Architecture">
<title>Architecture</title>
<style>
.l1,.l2,.l3,.c1,.c2,.dot{animation:1.6s cubic-bezier(.2,0,0,1) both 1}
.l1{animation-name:in;animation-duration:.45s}
.l2{animation-name:in;animation-duration:.45s;animation-delay:.22s}
.l3{animation-name:in;animation-duration:.45s;animation-delay:.44s}
.c1{animation-name:fade;animation-duration:.3s;animation-delay:.7s}
.c2{animation-name:fade;animation-duration:.3s;animation-delay:.95s}
.dot{transform-box:fill-box;transform-origin:center;animation-name:pop;animation-duration:.4s;animation-delay:1.2s}
@keyframes in{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(0)}70%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect class="l1" x="6" y="6" width="30" height="12" rx="4" stroke="#A6A2F8" stroke-width="4"/>
  <rect class="l2" x="17" y="26" width="30" height="12" rx="4" stroke="#A6A2F8" stroke-width="4"/>
  <rect class="l3" x="28" y="46" width="30" height="12" rx="4" stroke="#A6A2F8" stroke-width="4"/>
  <path class="c1" d="M12 18v14h5" stroke="#80D5D4" stroke-width="3" stroke-dasharray="3 4"/>
  <path class="c2" d="M23 38v14h5" stroke="#80D5D4" stroke-width="3" stroke-dasharray="3 4"/>
</g>
<circle class="dot" cx="51" cy="52" r="3.5" fill="#00F29E"/>
</svg>
