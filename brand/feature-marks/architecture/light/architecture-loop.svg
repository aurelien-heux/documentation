<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Architecture, working">
<title>Architecture, working</title>
<style>
.c1,.c2{animation:flow 2.8s linear infinite}
.l1,.l2,.l3{animation:2.8s cubic-bezier(.2,0,0,1) infinite}
.l1{animation-name:p1}.l2{animation-name:p2}.l3{animation-name:p3}
.dot{transform-box:fill-box;transform-origin:center;animation:beat 2.8s cubic-bezier(.2,0,0,1) infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes p1{0%,6%,24%,100%{opacity:1}14%{opacity:.4}}
@keyframes p2{0%,26%,44%,100%{opacity:1}34%{opacity:.4}}
@keyframes p3{0%,46%,64%,100%{opacity:1}54%{opacity:.4}}
@keyframes beat{0%,66%,92%,100%{transform:scale(1)}78%{transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <rect class="l1" x="6" y="6" width="30" height="12" rx="4" stroke="#39235F" stroke-width="4"/>
  <rect class="l2" x="17" y="26" width="30" height="12" rx="4" stroke="#39235F" stroke-width="4"/>
  <rect class="l3" x="28" y="46" width="30" height="12" rx="4" stroke="#39235F" stroke-width="4"/>
  <path class="c1" d="M12 18v14h5" stroke="#278383" stroke-width="3" stroke-dasharray="3 4"/>
  <path class="c2" d="M23 38v14h5" stroke="#278383" stroke-width="3" stroke-dasharray="3 4"/>
</g>
<circle class="dot" cx="51" cy="52" r="3.5" fill="#00A56B"/>
</svg>
