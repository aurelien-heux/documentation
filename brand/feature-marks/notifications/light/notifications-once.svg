<svg xmlns="http://www.w3.org/2000/svg" class="fm-notif run" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Notifications" style="overflow:visible"><style>@keyframes notif0run{0%{transform:translate(0px,-14px) rotate(-14deg);opacity:0}30%{transform:translate(0px,0px) rotate(10deg);opacity:1}48%{transform:translate(0px,0px) rotate(-7deg);opacity:1}64%{transform:translate(0px,0px) rotate(4deg);opacity:1}78%{transform:translate(0px,0px) rotate(-2deg);opacity:1}100%{transform:translate(0px,0px) rotate(0deg);opacity:1}}
.fm-notif.run .nt-bell{transform-origin:32px 6px;animation:notif0run 1.6s cubic-bezier(.2,0,0,1) 1 both}
@keyframes notif2run{0%{transform:scale(0)}62%{transform:scale(0)}78%{transform:scale(1.25)}90%{transform:scale(1)}100%{transform:scale(1)}}
.fm-notif.run .nt-dot{transform-box:fill-box;transform-origin:center;animation:notif2run 1.6s cubic-bezier(.2,0,0,1) 1 both}
@media (prefers-reduced-motion: reduce){.fm-notif.run *{animation:none!important}}</style><defs></defs><g transform="translate(0 0)"><g class="nt-bell"><circle cx="32" cy="8" r="3.6" fill="#39235F"/><path d="M32 9C22 9 17 17 17 27V38L12 46Q11 48.5 13.5 48.5H50.5Q53 48.5 52 46L47 38V27C47 17 42 9 32 9Z" fill="#39235F"/><circle class="nt-clap" cx="32" cy="53.5" r="5" fill="#278383"/></g><circle class="nt-dot" cx="48.5" cy="15" r="8" fill="#00A56B" stroke="#FDF8FD" stroke-width="3.5"/></g></svg>