<svg xmlns="http://www.w3.org/2000/svg" class="fm-notif loop" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Notifications" style="overflow:visible"><style>@keyframes notif0loop{0%{transform:translate(0px,0px) rotate(0deg)}6%{transform:translate(0px,0px) rotate(12deg)}14%{transform:translate(0px,0px) rotate(-10deg)}22%{transform:translate(0px,0px) rotate(8deg)}30%{transform:translate(0px,0px) rotate(-5deg)}38%{transform:translate(0px,0px) rotate(2deg)}46%{transform:translate(0px,0px) rotate(0deg)}100%{transform:translate(0px,0px) rotate(0deg)}}
.fm-notif.loop .nt-bell{transform-origin:32px 6px;animation:notif0loop 2.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes notif1loop{0%{transform:translate(0px,0px)}8%{transform:translate(3px,0px)}16%{transform:translate(-3px,0px)}24%{transform:translate(2px,0px)}32%{transform:translate(-1.5px,0px)}42%{transform:translate(0px,0px)}100%{transform:translate(0px,0px)}}
.fm-notif.loop .nt-clap{animation:notif1loop 2.6s cubic-bezier(.45,0,.55,1) infinite}
@keyframes notif2loop{0%{transform:scale(1)}48%{transform:scale(1)}56%{transform:scale(1.3)}66%{transform:scale(1)}100%{transform:scale(1)}}
.fm-notif.loop .nt-dot{transform-box:fill-box;transform-origin:center;animation:notif2loop 2.6s cubic-bezier(.2,0,0,1) infinite}
@media (prefers-reduced-motion: reduce){.fm-notif.loop *{animation:none!important}}</style><defs></defs><g transform="translate(0 0)"><g class="nt-bell"><circle cx="32" cy="8" r="3.6" fill="#39235F"/><path d="M32 9C22 9 17 17 17 27V38L12 46Q11 48.5 13.5 48.5H50.5Q53 48.5 52 46L47 38V27C47 17 42 9 32 9Z" fill="#39235F"/><circle class="nt-clap" cx="32" cy="53.5" r="5" fill="#278383"/></g><circle class="nt-dot" cx="48.5" cy="15" r="8" fill="#00A56B" stroke="#FDF8FD" stroke-width="3.5"/></g></svg>