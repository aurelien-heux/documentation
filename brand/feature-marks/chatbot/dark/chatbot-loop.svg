<svg xmlns="http://www.w3.org/2000/svg" class="fm-chatbot loop" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Chatbot" style="overflow:visible"><style>@keyframes chatbot1loop{0%{opacity:1}8%{opacity:1}14%{opacity:0}86%{opacity:0}94%{opacity:1}100%{opacity:1}}
