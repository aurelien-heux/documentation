<svg xmlns="http://www.w3.org/2000/svg" class="fm-env loop" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Environments" style="overflow:visible"><style>@keyframes env1loop{0%{transform:scale(1)}4%{transform:scale(1)}10%{transform:scale(1.18)}18%{transform:scale(1)}100%{transform:scale(1)}}
.fm-env.loop .ev-n0{transform-box:fill-box;transform-origin:center;animation:env1loop 2.8s cubic-bezier(.2,0,0,1) infinite}
@keyframes env2loop{0%{transform:scale(1)}36%{transform:scale(1)}42%{transform:scale(1.18)}50%{transform:scale(1)}100%{transform:scale(1)}}
.fm-env.loop .ev-n1{transform-box:fill-box;transform-origin:center;animation:env2loop 2.8s cubic-bezier(.2,0,0,1) infinite}
@keyframes env3loop{0%{transform:scale(1)}70%{transform:scale(1)}76%{transform:scale(1.16)}86%{transform:scale(1)}100%{transform:scale(1)}}
