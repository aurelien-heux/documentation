<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<div style="width:328px;padding:24px;border-radius:var(--radius-xl);background:var(--surface-container-high);box-shadow:var(--elevation-3);display:flex;flex-direction:column;gap:16px"><span class="lbl-m muted">Select time</span><div style="display:flex;align-items:center;gap:8px"><div style="width:96px;height:80px;border-radius:var(--radius-sm);background:var(--primary-container);color:var(--on-primary-container);font-size:57px;line-height:64px;font-weight:400;display:flex;align-items:center;justify-content:center">14</div><span style="font-size:57px;line-height:64px">:</span><div style="width:96px;height:80px;border-radius:var(--radius-sm);background:var(--surface-container-highest);color:var(--on-surface);font-size:57px;line-height:64px;display:flex;align-items:center;justify-content:center">30</div><div style="display:flex;flex-direction:column;width:52px;height:80px;border:1px solid var(--outline);border-radius:var(--radius-sm);overflow:hidden"><button type="button" class="lbl" style="flex:1;border:0;border-bottom:1px solid var(--outline);background:transparent;color:var(--on-surface-variant)">AM</button><button type="button" class="lbl" style="flex:1;border:0;background:var(--tertiary-container);color:var(--on-tertiary-container)">PM</button></div></div><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="lbl" style="height:40px;padding:0 12px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--primary)">Cancel</button><button type="button" class="lbl" style="height:40px;padding:0 12px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--primary)">OK</button></div></div>
</body></html>
