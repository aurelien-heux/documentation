<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,label,legend,.ui{font-family:var(--font-ui)}button{cursor:pointer}
input,select{font-family:var(--font-body)}
</style><style></style></head>
<body>
<span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:var(--radius-xs);background:var(--success-container);color:var(--on-success-container);display:inline-flex;align-items:center;gap:6px"><svg class="ait-state-tile ait-state-success" viewBox="0 0 64 64" width="18" height="18" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--success-container)"/><path d="M17 23l10 9-10 9" fill="none" stroke="var(--on-success-container)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 33l5 5 10-10" fill="none" stroke="var(--on-success-container)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>12 healthy</span>
<span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:var(--radius-xs);background:var(--warning-container);color:var(--on-warning-container);display:inline-flex;align-items:center;gap:6px"><svg class="ait-state-tile ait-state-warning" viewBox="0 0 64 64" width="18" height="18" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--warning-container)"/><path d="M17 23l10 9-10 9" fill="none" stroke="var(--on-warning-container)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M42 23v10" fill="none" stroke="var(--on-warning-container)" stroke-width="7" stroke-linecap="round"/><circle cx="42" cy="43" r="4" fill="var(--on-warning-container)"/></svg>2 degraded</span>
<span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:var(--radius-xs);background:var(--error-container);color:var(--on-error-container);display:inline-flex;align-items:center;gap:6px"><svg class="ait-state-tile ait-state-error" viewBox="0 0 64 64" width="18" height="18" aria-hidden="true"><rect width="64" height="64" rx="14" fill="var(--error-container)"/><path d="M17 23l10 9-10 9" fill="none" stroke="var(--on-error-container)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M35 25l14 14M49 25L35 39" fill="none" stroke="var(--on-error-container)" stroke-width="7" stroke-linecap="round"/></svg>1 down</span>
<span style="font-size:11px;font-weight:500;padding:4px 8px;border-radius:var(--radius-xs);background:var(--surface-container-highest);color:var(--on-surface-variant);display:inline-flex;align-items:center;gap:6px"><span style="width:6px;height:6px;border-radius:var(--radius-full);background:var(--outline)"></span>unknown</span>
<span style="font-family:var(--font-plain);font-size:12px;display:inline-flex;gap:14px;margin-left:12px"><span style="color:var(--success)">INFO</span><span style="color:var(--warning)">WARN</span><span style="color:var(--error)">ERR</span></span>
</body></html>
