<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,label,legend,.ui{font-family:var(--font-ui)}button{cursor:pointer}
input,select{font-family:var(--font-body)}
</style><style></style></head>
<body>
<div style="width:100%;min-height:340px;position:relative;border-radius:var(--radius-md);overflow:hidden;background:var(--surface-container-low)">
<div style="position:absolute;inset:0;background:color-mix(in srgb, var(--scrim) 32%, transparent)"></div>
<div role="dialog" aria-labelledby="dt" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,92%);box-sizing:border-box;padding:24px;border-radius:var(--radius-xl);background:var(--surface-container-high);color:var(--on-surface);display:flex;flex-direction:column;gap:16px;box-shadow:var(--elevation-3)">
<div style="display:flex;flex-direction:column;gap:8px"><span id="dt" class="ui" style="font-size:24px;line-height:32px;font-weight:500">New workspace</span><span style="font-size:14px;line-height:20px;color:var(--on-surface-variant)">A workspace groups the tools, secrets and environments for one team.</span></div>
<form style="display:flex;flex-direction:column;gap:18px;margin:0" onsubmit="return false">
<div style="position:relative;display:flex;flex-direction:column"><label for="d1" style="position:absolute;top:-8px;left:12px;padding:0 4px;background:var(--surface-container-high);font-size:12px;font-weight:500;color:var(--primary)">Workspace name</label><input id="d1" type="text" value="platform-eu" style="height:56px;box-sizing:border-box;padding:0 16px;border:2px solid var(--primary);border-radius:var(--radius-xs);background:transparent;color:var(--on-surface);font-size:16px"></div>
<fieldset style="margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:8px"><legend style="font-size:12px;font-weight:500;color:var(--on-surface-variant);padding:0 0 2px">Environment</legend><div style="display:flex;gap:8px;flex-wrap:wrap"><label style="display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 16px 0 8px;border-radius:var(--radius-sm);background:var(--secondary-container);color:var(--on-secondary-container);font-size:14px;font-weight:500"><input type="radio" name="env" checked style="position:absolute;opacity:0;width:1px;height:1px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Staging</label><label style="display:inline-flex;align-items:center;height:32px;padding:0 16px;border:1px solid var(--outline);border-radius:var(--radius-sm);color:var(--on-surface);font-size:14px;font-weight:500"><input type="radio" name="env" style="position:absolute;opacity:0;width:1px;height:1px">Production</label></div></fieldset>
</form>
<div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" style="height:40px;padding:0 12px;border:0;border-radius:var(--radius-lg);background:transparent;color:var(--primary);font-size:14px;font-weight:500">Cancel</button><button type="button" style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-lg);background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:500">Create workspace</button></div>
</div></div>
</body></html>
