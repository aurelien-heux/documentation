<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<button type="button" class="ib" aria-label="Settings"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg></button><button type="button" class="ib" aria-label="Done" style="background:var(--primary);color:var(--on-primary)"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></button><button type="button" class="ib" aria-label="Edit" style="background:var(--secondary-container);color:var(--on-secondary-container)"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><button type="button" class="ib" aria-label="Share" style="border:1px solid var(--outline);color:var(--on-surface-variant)"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></button><button type="button" class="ib" aria-label="Favorite, selected" aria-pressed="true" style="color:var(--primary)"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button><button type="button" class="ib" aria-label="Disabled" disabled style="color:color-mix(in srgb, var(--on-surface) 38%, transparent)"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/></svg></button>
