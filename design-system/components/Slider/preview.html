<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<div class="col" style="width:360px;gap:28px"><div style="position:relative;height:16px"><div style="position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--primary-container)"></div><div style="position:absolute;left:0;width:62%;top:6px;height:4px;border-radius:2px;background:var(--primary)"></div><div style="position:absolute;left:calc(62% - 2px);top:-4px;width:4px;height:24px;border-radius:2px;background:var(--primary)"></div><div style="position:absolute;left:calc(62% - 18px);top:-40px;padding:4px 10px;border-radius:var(--radius-full);background:var(--inverse-surface);color:var(--inverse-on-surface);font-size:12px;font-weight:500">62</div></div><div style="position:relative;height:16px"><div style="position:absolute;left:0;right:0;top:6px;height:4px;border-radius:2px;background:var(--primary-container)"></div><div style="position:absolute;left:20%;width:40%;top:6px;height:4px;border-radius:2px;background:var(--primary)"></div><div style="position:absolute;left:calc(20% - 2px);top:-4px;width:4px;height:24px;border-radius:2px;background:var(--primary)"></div><div style="position:absolute;left:calc(60% - 2px);top:-4px;width:4px;height:24px;border-radius:2px;background:var(--primary)"></div><span style="position:absolute;left:calc(0% - 2px);top:6px;width:4px;height:4px;border-radius:2px;background:var(--on-primary-container)"></span><span style="position:absolute;left:calc(20% - 2px);top:6px;width:4px;height:4px;border-radius:2px;background:var(--on-primary)"></span><span style="position:absolute;left:calc(40% - 2px);top:6px;width:4px;height:4px;border-radius:2px;background:var(--on-primary)"></span><span style="position:absolute;left:calc(60% - 2px);top:6px;width:4px;height:4px;border-radius:2px;background:var(--on-primary)"></span><span style="position:absolute;left:calc(80% - 2px);top:6px;width:4px;height:4px;border-radius:2px;background:var(--on-primary-container)"></span><span style="position:absolute;left:calc(100% - 2px);top:6px;width:4px;height:4px;border-radius:2px;background:var(--on-primary-container)"></span></div></div>
</body></html>
