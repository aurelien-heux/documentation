<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<div class="col" style="width:420px;gap:16px"><div style="display:flex;border-bottom:1px solid var(--outline-variant)"><button type="button" role="tab" aria-selected="true" class="lbl" style="flex:1;height:48px;border:0;background:transparent;color:var(--primary);position:relative">Overview<span style="position:absolute;left:24px;right:24px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--primary)"></span></button><button type="button" role="tab" aria-selected="false" class="lbl" style="flex:1;height:48px;border:0;background:transparent;color:var(--on-surface-variant);position:relative">Runs</button><button type="button" role="tab" aria-selected="false" class="lbl" style="flex:1;height:48px;border:0;background:transparent;color:var(--on-surface-variant);position:relative">Secrets</button></div><div style="display:flex;border-bottom:1px solid var(--outline-variant)"><button type="button" role="tab" class="lbl" style="height:48px;padding:0 16px;border:0;background:transparent;color:var(--primary);position:relative">Logs<span style="position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--primary)"></span></button><button type="button" role="tab" class="lbl" style="height:48px;padding:0 16px;border:0;background:transparent;color:var(--on-surface-variant);position:relative">Metrics</button><button type="button" role="tab" class="lbl" style="height:48px;padding:0 16px;border:0;background:transparent;color:var(--on-surface-variant);position:relative">Config</button><button type="button" role="tab" class="lbl" style="height:48px;padding:0 16px;border:0;background:transparent;color:var(--on-surface-variant);position:relative">Events</button></div></div>
</body></html>
