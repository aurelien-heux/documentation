<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<div class="frame" style="width:420px;height:240px;display:flex"><div style="flex:1;padding:16px"><span class="muted" style="font-size:13px">Content</span></div><div style="width:256px;border-left:1px solid var(--outline-variant);background:var(--surface);display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:8px;padding:12px 8px 12px 24px"><span style="flex:1;font-size:22px;font-weight:500">Filters</span><button type="button" class="ib" aria-label="Close"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div><div class="col" style="padding:0 24px;gap:8px"><label class="row" style="min-height:40px;gap:12px"><input type="checkbox" checked>Failed only</label><label class="row" style="min-height:40px;gap:12px"><input type="checkbox">Last 24 h</label></div><div style="margin-top:auto;padding:16px 24px;display:flex;gap:8px;border-top:1px solid var(--outline-variant)"><button type="button" class="lbl" style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-full);background:var(--primary);color:var(--on-primary)">Apply</button><button type="button" class="lbl" style="height:40px;padding:0 16px;border:1px solid var(--outline);border-radius:var(--radius-full);background:transparent;color:var(--primary)">Reset</button></div></div></div>
</body></html>
