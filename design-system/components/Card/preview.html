<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,label,legend,.ui{font-family:var(--font-ui)}button{cursor:pointer}
input,select{font-family:var(--font-body)}
</style><style></style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;width:100%">
<div style="padding:16px;border-radius:var(--radius-md);background:var(--surface-container-lowest);box-shadow:var(--elevation-1);display:flex;flex-direction:column;gap:6px"><div style="display:flex;justify-content:space-between;align-items:center"><span class="ui" style="font-size:16px;font-weight:500">api-gateway</span><span style="font-family:var(--font-plain);font-size:11px;padding:3px 8px;border-radius:var(--radius-xs);background:var(--success-container);color:var(--on-success-container)">passing</span></div><span style="font-size:14px;color:var(--on-surface-variant)">Elevated · last run 4 min ago on main</span><div style="display:flex;gap:8px;margin-top:6px"><button type="button" style="height:40px;padding:0 12px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--primary);font-size:14px;font-weight:500">Logs</button><button type="button" style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-full);background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:500">Open</button></div></div>
<div style="padding:16px;border-radius:var(--radius-md);background:var(--surface-container-high);display:flex;flex-direction:column;gap:6px"><span class="ui" style="font-size:16px;font-weight:500">Filled card</span><span style="font-size:14px;color:var(--on-surface-variant)">surface-container-high, no shadow. Dense lists.</span></div>
<div style="padding:16px;border-radius:var(--radius-md);background:var(--surface);border:1px solid var(--outline-variant);display:flex;flex-direction:column;gap:6px"><span class="ui" style="font-size:16px;font-weight:500">Outlined card</span><span style="font-size:14px;color:var(--on-surface-variant)">outline-variant border. Secondary content.</span></div>
</div>
</body></html>
