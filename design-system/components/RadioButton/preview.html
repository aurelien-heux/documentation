<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<label class="row" style="gap:12px;min-height:44px"><span style="width:20px;height:20px;border-radius:var(--radius-full);border:2px solid var(--primary);box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;position:relative"><input type="radio" name="r" checked style="position:absolute;opacity:0;width:20px;height:20px;margin:0"><span style="width:10px;height:10px;border-radius:5px;background:var(--primary)"></span></span>Blue/green</label><label class="row" style="gap:12px;min-height:44px"><span style="width:20px;height:20px;border-radius:var(--radius-full);border:2px solid var(--on-surface-variant);box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;position:relative"><input type="radio" name="r"  style="position:absolute;opacity:0;width:20px;height:20px;margin:0"></span>Rolling</label><label class="row" style="gap:12px;min-height:44px"><span style="width:20px;height:20px;border-radius:var(--radius-full);border:2px solid var(--on-surface-variant);box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;position:relative"><input type="radio" name="r"  style="position:absolute;opacity:0;width:20px;height:20px;margin:0"></span>Recreate</label><label class="row" style="gap:12px;min-height:44px"><span style="width:20px;height:20px;border-radius:var(--radius-full);border:2px solid color-mix(in srgb, var(--on-surface) 38%, transparent);box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;position:relative"><input type="radio" name="r" disabled style="position:absolute;opacity:0;width:20px;height:20px;margin:0"></span>Disabled</label>
</body></html>
