<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,label,legend,.ui{font-family:var(--font-ui)}button{cursor:pointer}
input,select{font-family:var(--font-body)}
</style><style></style></head>
<body>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:24px;width:100%">
<div style="position:relative;display:flex;flex-direction:column"><label for="f1" style="position:absolute;top:-8px;left:12px;padding:0 4px;background:var(--surface);font-size:12px;font-weight:500;color:var(--primary)">Repository URL</label><input id="f1" type="text" value="devops.example.internal/platform/aitoolbox" style="height:56px;box-sizing:border-box;padding:0 16px;border:2px solid var(--primary);border-radius:var(--radius-xs);background:transparent;color:var(--on-surface);font-size:15px;font-family:var(--font-plain);font-weight:600"><span style="font-size:12px;color:var(--on-surface-variant);padding:4px 16px 0">Public or private, HTTPS or SSH</span></div>
<div style="position:relative;display:flex;flex-direction:column"><label for="f2" style="position:absolute;top:-8px;left:12px;padding:0 4px;background:var(--surface);font-size:12px;font-weight:500;color:var(--on-surface-variant)">Workspace name</label><input id="f2" type="text" placeholder="platform-eu" style="height:56px;box-sizing:border-box;padding:0 16px;border:1px solid var(--outline);border-radius:var(--radius-xs);background:transparent;color:var(--on-surface);font-size:16px"><span style="font-size:12px;color:var(--on-surface-variant);padding:4px 16px 0">Lower-case, hyphens allowed</span></div>
<div style="position:relative;display:flex;flex-direction:column"><label for="f3" style="position:absolute;top:-8px;left:12px;padding:0 4px;background:var(--surface);font-size:12px;font-weight:500;color:var(--error)">API token</label><input id="f3" type="text" value="dtb_" aria-invalid="true" style="height:56px;box-sizing:border-box;padding:0 16px;border:2px solid var(--error);border-radius:var(--radius-xs);background:transparent;color:var(--on-surface);font-size:15px;font-family:var(--font-plain);font-weight:600"><span style="font-size:12px;color:var(--error);padding:4px 16px 0">Token must be 40 characters</span></div>
</div>
</body></html>
