<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<div class="frame" style="width:360px;height:220px;position:relative;background:var(--surface-container-low)"><div style="position:absolute;inset:0;background:color-mix(in srgb, var(--scrim) 32%, transparent)"></div><div style="position:absolute;left:0;right:0;bottom:0;border-radius:var(--radius-xl) var(--radius-xl) 0 0;background:var(--surface-container-low);padding:8px 16px 16px;display:flex;flex-direction:column;gap:8px"><div style="width:32px;height:4px;border-radius:2px;background:var(--outline);margin:0 auto 8px"></div><span style="font-size:16px;font-weight:500">api-gateway</span><div class="row" style="gap:8px"><button type="button" class="lbl" style="height:40px;padding:0 16px;border:0;border-radius:var(--radius-full);background:var(--secondary-container);color:var(--on-secondary-container)">Logs</button><button type="button" class="lbl" style="height:40px;padding:0 16px;border:0;border-radius:var(--radius-full);background:var(--secondary-container);color:var(--on-secondary-container)">Restart</button><button type="button" class="lbl" style="height:40px;padding:0 16px;border:0;border-radius:var(--radius-lg);background:var(--tertiary-container);color:var(--on-tertiary-container);display:inline-flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="var(--on-tertiary-container)" stroke="var(--on-tertiary-container)" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l12 8-12 8z"/></svg>Deploy</button></div></div></div>
