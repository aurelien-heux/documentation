<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button,label,legend,.ui{font-family:var(--font-ui)}button{cursor:pointer}
input,select{font-family:var(--font-body)}
</style><style></style></head>
<body>
<button type="button" style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-lg);background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:500;letter-spacing:.1px;">Filled</button><button type="button" style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-lg);background:var(--secondary-container);color:var(--on-secondary-container);font-size:14px;font-weight:500;letter-spacing:.1px;">Tonal</button><button type="button" style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-lg);background:var(--surface-container-low);color:var(--primary);font-size:14px;font-weight:500;letter-spacing:.1px;box-shadow:var(--elevation-1)">Elevated</button><button type="button" style="height:40px;padding:0 24px;border:1px solid var(--outline);border-radius:var(--radius-lg);background:transparent;color:var(--primary);font-size:14px;font-weight:500">Outlined</button><button type="button" style="height:40px;padding:0 12px;border:0;border-radius:var(--radius-lg);background:transparent;color:var(--primary);font-size:14px;font-weight:500">Text</button><button type="button" style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-lg);background:var(--tertiary-container);color:var(--on-tertiary-container);font-size:14px;font-weight:500;letter-spacing:.1px;padding:0 24px 0 16px;display:inline-flex;align-items:center;gap:8px"><svg style="color:var(--on-tertiary-container)" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l12 8-12 8z" fill="currentColor"/></svg>Run pipeline</button><button type="button" style="height:32px;padding:0 10px 0 6px;border:0;border-radius:10px;background:transparent;color:var(--primary);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px"><span style="width:22px;height:22px;border-radius:50%;background:var(--tertiary-container);color:var(--on-tertiary-container);display:inline-flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 5l12 7-12 7z"/></svg></span>Re-run</button><button type="button" disabled style="height:40px;padding:0 24px;border:0;border-radius:var(--radius-lg);background:color-mix(in srgb, var(--on-surface) 12%, transparent);color:color-mix(in srgb, var(--on-surface) 38%, transparent);font-size:14px;font-weight:500">Disabled</button>
</body></html>
