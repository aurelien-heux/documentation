<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<label class="row" style="gap:12px;min-height:44px"><span style="position:relative;width:52px;height:32px;border-radius:var(--radius-full);background:var(--primary);display:inline-flex;align-items:center;justify-content:flex-end;padding:0 4px;box-sizing:border-box"><input type="checkbox" checked style="position:absolute;opacity:0;inset:0;margin:0"><span style="width:24px;height:24px;border-radius:12px;background:var(--on-primary);color:var(--primary);display:inline-flex;align-items:center;justify-content:center"><svg class="ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"/></svg></span></span>On, with icon</label><label class="row" style="gap:12px;min-height:44px"><span style="position:relative;width:52px;height:32px;border-radius:var(--radius-full);background:var(--surface-container-highest);border:2px solid var(--outline);box-sizing:border-box;display:inline-flex;align-items:center;padding:0 6px"><input type="checkbox" style="position:absolute;opacity:0;inset:0;margin:0"><span style="width:16px;height:16px;border-radius:8px;background:var(--outline)"></span></span>Off</label><label class="row" style="gap:12px;min-height:44px"><span style="position:relative;width:52px;height:32px;border-radius:var(--radius-full);background:color-mix(in srgb, var(--surface-container-highest) 12%, transparent);border:2px solid color-mix(in srgb, var(--on-surface) 12%, transparent);box-sizing:border-box;display:inline-flex;align-items:center;padding:0 6px"><input type="checkbox" disabled style="position:absolute;opacity:0;inset:0;margin:0"><span style="width:16px;height:16px;border-radius:8px;background:color-mix(in srgb, var(--on-surface) 38%, transparent)"></span></span>Disabled</label>
</body></html>
