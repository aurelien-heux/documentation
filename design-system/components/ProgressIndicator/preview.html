<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>
<body>
<style>@keyframes ait-po-spin{to{transform:rotate(360deg)}}
.ait-po{animation:ait-po-spin 1.4s linear infinite;transform-origin:center}
@keyframes ait-gl-run{0%{transform:translateX(-30%)}100%{transform:translateX(105%)}}
.ait-gl-bar{animation:ait-gl-run 1.8s cubic-bezier(.2,0,0,1) infinite}
@keyframes ait-cd-draw{0%,6%{stroke-dashoffset:100}70%,100%{stroke-dashoffset:0}}
@keyframes ait-cd-pen{0%,6%{offset-distance:0%;opacity:1}70%{offset-distance:100%;opacity:1}73%,100%{offset-distance:100%;opacity:0}}
@keyframes ait-cd-fill{0%,72%{opacity:0}78%,100%{opacity:1}}
.ait-cd-loop .ait-cd-line{animation:ait-cd-draw 4s linear infinite}
.ait-cd-loop .ait-cd-pen{animation:ait-cd-pen 4s linear infinite}
.ait-cd-loop .ait-cd-solid{animation:ait-cd-fill 4s linear infinite}
.ait-cd-pen{offset-path:path("M44 22H14a10 10 0 0 0-10 10v16a10 10 0 0 0 10 10h36a10 10 0 0 0 10-10V32a10 10 0 0 0-10-10H44");offset-rotate:0deg}
.ait-cd[style*="--p"] .ait-cd-line{stroke-dashoffset:calc(100 - var(--p))}
.ait-cd[style*="--p"] .ait-cd-pen{offset-distance:calc(var(--p) * 1%)}
.ait-cd[style*="--p"] .ait-cd-solid{opacity:0}
.ait-cd.ait-cd-done .ait-cd-solid{opacity:1}.ait-cd.ait-cd-done .ait-cd-pen{opacity:0}
@keyframes ait-dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
.ait-dot{animation:ait-dot 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: reduce){.ait-po{animation:none!important}.ait-gl-bar,.ait-dot,.ait-cd-loop *{animation:none!important}.ait-cd-loop .ait-cd-solid{opacity:1}.ait-cd-loop .ait-cd-pen{opacity:0}}</style>

size="11" fill="var(--ai)">62%</text></svg>
