<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap"><style>
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}:is(input,select,textarea):focus-visible{outline:none;border-color:var(--primary)!important;box-shadow:inset 0 0 0 1px var(--primary)}[role=tab]:focus-visible{outline-offset:-3px}

body{margin:0;padding:16px;background:var(--surface);color:var(--on-surface);font-family:var(--font-body);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
button,label,a,nav,legend,[role=tab],.ui,.lbl,.lbl-m{font-family:var(--font-ui)}button{cursor:pointer}input,select,textarea{font-family:var(--font-body)}
.ic{display:inline-flex}
.ib{width:40px;height:40px;border:0;border-radius:var(--radius-full);background:transparent;color:var(--on-surface-variant);display:inline-flex;align-items:center;justify-content:center}
.lbl{font-size:14px;font-weight:500;letter-spacing:.1px}
.lbl-m{font-size:12px;font-weight:500;letter-spacing:.5px}
.muted{color:var(--on-surface-variant)}
.mono{font-family:var(--font-plain);font-weight:600}
.frame{border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--outline-variant);background:var(--surface)}
.row{display:flex;align-items:center;gap:16px}
.col{display:flex;flex-direction:column}
</style><style></style></head>

<div style="width:420px;height:80px;display:flex;align-items:center;gap:4px;padding:0 16px 0 4px;box-sizing:border-box;background:var(--nav-container)"><button type="button" class="ib" aria-label="Search"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button><button type="button" class="ib" aria-label="Share"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M16 6l-4-4-4 4M12 2v13"/></svg></button><button type="button" class="ib" aria-label="Edit"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button><span style="flex:1"></span><button type="button" aria-label="New" style="width:56px;height:56px;border:0;border-radius:var(--radius-lg);background:var(--primary-container);color:var(--on-primary-container);display:inline-flex;align-items:center;justify-content:center"><svg class="ic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
