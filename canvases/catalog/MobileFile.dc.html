<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Skill file viewer on a phone, group_prs.py</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#39235F}a:hover{color:#14085E}
.ui{font-family:'BNPP Type',Manrope,'Segoe UI',system-ui,sans-serif}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FDF8FD; color: #1C1B1E; font-family: 'Open Sans', system-ui, sans-serif">
  <header style="height: 64px; flex: none; background: #F8F1FF; display: flex; align-items: center; gap: 4px; padding: 0 4px; border-bottom: 1px solid #CAC4CF">
    <a href="Mobile.dc.html" aria-label="Back to Release notes" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: #48454E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></a>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
      <span style="font-size: 15px; font-weight: 600">group_prs.py</span>
      <span style="font-size: 12px; color: #48454E">Release notes · scripts/ · 18 lines</span>
    </div>
    <button type="button" aria-label="Copy group_prs.py" style="width: 48px; height: 48px; border: 0; background: transparent; color: #48454E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg></button>
  </header>

  <div style="display: flex; gap: 8px; align-items: flex-start; padding: 12px 16px; font-size: 13px; line-height: 18px; color: #1C1B1E; background: #FAF4FF">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#48454E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 1px"><path d="M6 4l14 8-14 8z"/></svg>
    <span>Runs in the sandbox: no network, no credentials. Its input comes from the DevOps tool.</span>
  </div>

  <div style="flex: 1; min-height: 0; overflow: auto; background: #ECE5F4; padding: 12px 0">
    <sc-for list="{{code}}" as="l" hint-placeholder-count="18">
      <div style="display: flex; font-size: 12px; line-height: 20px; font-weight: 600; white-space: pre"><span style="width: 36px; flex: none; text-align: right; padding-right: 10px; color: #48454E; font-weight: 400">{{l.n}}</span><span style="padding-right: 16px"><sc-for list="{{l.toks}}" as="t" hint-placeholder-count="3"><span style="{{t.style}}">{{t.t}}</span></sc-for></span></div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; gap: 8px; padding: 12px 16px 20px; background: #FDF8FD; border-top: 1px solid #CAC4CF">
    <a href="#" class="ui" style="flex: 1; height: 44px; border-radius: 16px; border: 1px solid #79757F; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">Open in Git</a>
    <a href="#" class="ui" style="flex: 1; height: 44px; border-radius: 16px; background: #DED7EB; color: #1D1A28; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; text-decoration: none">Next file</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const src = [
      '"""Group merged pull requests by section."""',
      'import json', 'import sys', '',
      'SECTIONS = {"feature": "New", "bug": "Fixed",', '            "tech-debt": "Under the hood"}', '', '',
      'def group(prs, keep_chores=False):',
      '    out = {name: [] for name in SECTIONS.values()}',
      '    for pr in prs:',
      '        if "chore" in pr["labels"] and not keep_chores:',
      '            continue  # left out unless asked',
      '        out[SECTIONS.get(pr["type"], "Under the hood")].append(pr)',
      '    return out', '', '',
      'if __name__ == "__main__":'
    ];
    const tok = (line) => {
      const re = /(#.*$)|("[^"]*")|\b(def|import|for|in|if|not|and|continue|return|False)\b/g;
      const out = []; let last = 0, m;
      while ((m = re.exec(line))) {
        if (m.index > last) out.push({ t: line.slice(last, m.index), style: '' });
        out.push({ t: m[0], style: m[1] ? 'color: #5E5868; font-style: italic; font-weight: 400' : m[2] ? 'color: #404B23' : 'color: #39235F' });
        last = m.index + m[0].length;
      }
      if (last < line.length) out.push({ t: line.slice(last), style: '' });
      if (!out.length) out.push({ t: ' ', style: '' });
      return out;
    };
    return { code: src.map((l, i) => ({ n: i + 1, toks: tok(l) })) };
  }
}
</script>
</body>
</html>
