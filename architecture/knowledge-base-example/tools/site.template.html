* { box-sizing:border-box; }
html, body { min-height:100%; }
body { background:var(--surface); color:var(--on-surface); font-family:var(--plain); font-size:14px; line-height:20px; }
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--nav-container); }
h1,h2,h3 { margin:0; font-family:var(--brand); text-wrap:balance; }
button { font:inherit; color:inherit; }
a { color:var(--primary); }
code, .mono { font-family:var(--plain); font-weight:600; font-size:13px; }
.sym { font-family:'Material Symbols Outlined'; font-weight:400; font-style:normal; font-size:24px; line-height:1; letter-spacing:normal; text-transform:none; white-space:nowrap; direction:ltr; -webkit-font-smoothing:antialiased; display:inline-block; width:1em; overflow:hidden; flex:none; }
:root:not(.icons-ready) .sym { color:transparent !important; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }

/* type scale */
.headline-small { font-family:var(--brand); font-size:24px; line-height:32px; font-weight:700; }
.title-large { font-family:var(--brand); font-size:22px; line-height:28px; font-weight:700; }
.title-medium { font-family:var(--brand); font-size:16px; line-height:24px; font-weight:600; }
.title-small { font-family:var(--brand); font-size:14px; line-height:20px; font-weight:600; }
.label-large { font-family:var(--brand); font-size:14px; line-height:20px; font-weight:600; }
.label-medium { font-family:var(--brand); font-size:12px; line-height:16px; font-weight:600; }
.body-small { font-size:12px; line-height:16px; }
.muted { color:var(--on-surface-variant); }

/* ---------- TopAppBar ---------- */
.top { position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--nav-container); height:64px; display:flex; align-items:center; gap:8px;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); margin-bottom:2px; }
.logo { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--on-surface); flex:none; }
.logo-word { font-family:var(--brand); font-weight:800; font-size:20px; letter-spacing:-.01em; }
.search { flex:1 1 auto; display:flex; justify-content:center; min-width:0; }
.search-field { width:100%; max-width:600px; height:44px; display:flex; align-items:center; gap:8px; padding:0 6px 0 14px; border-radius:var(--r-lg);
  background:var(--sc-lowest); border:1px solid transparent; }
.search-field:focus-within { border:2px solid var(--primary); padding-left:13px; }
.search-field .sym { color:var(--on-surface-variant); }
.search-field input { flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--on-surface); font:inherit; font-size:16px; }
.search-field input::placeholder { color:var(--on-surface-variant); }
.kbd { font-family:var(--plain); font-weight:600; font-size:11px; color:var(--on-surface-variant); border:1px solid var(--outline-variant); border-radius:var(--r-xs); padding:1px 5px; }
.ask { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px 0 8px; border-radius:var(--r-sm); border:0; background:var(--ai-container); color:var(--on-ai-container); cursor:not-allowed; }
.ask .sym { font-size:18px; color:var(--on-ai-container); }
.actions { display:flex; align-items:center; gap:4px; flex:none; }
.icon-btn { width:40px; height:40px; border-radius:9999px; border:0; background:transparent; color:var(--on-surface-variant); display:inline-grid; place-items:center; cursor:pointer; position:relative; }
.icon-btn:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.icon-btn:active { background:color-mix(in srgb, var(--primary) 10%, transparent); }
.badge { position:absolute; top:4px; right:4px; min-width:16px; height:16px; padding:0 4px; border-radius:9999px; background:var(--error); color:var(--on-error); font-size:11px; line-height:16px; font-weight:600; text-align:center; }
.vdiv { width:1px; height:32px; background:var(--outline-variant); margin:0 4px; }
.user { display:flex; align-items:center; gap:10px; height:48px; padding:0 8px 0 4px; border-radius:var(--r-lg); border:0; background:transparent; cursor:pointer; text-align:left; }
.user:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.avatar { width:36px; height:36px; border-radius:9999px; background:var(--nav-active); color:var(--on-secondary-container); display:grid; place-items:center; font-family:var(--brand); font-weight:700; font-size:14px; }
.user .who { display:grid; line-height:16px; }
.user .who b { font-family:var(--brand); font-size:14px; font-weight:600; }

/* ---------- Shell ---------- */
.shell { display:flex; align-items:flex-start; min-height:calc(100vh - 66px); }
.drawer { position:sticky; top:calc(66px + env(safe-area-inset-top,0px)); flex:none; width:300px; height:calc(100vh - 66px - env(safe-area-inset-top,0px)); background:var(--nav-container);
  border-radius:0 var(--r-lg) var(--r-lg) 0; padding:8px 12px 12px; display:flex; flex-direction:column; gap:2px; overflow-y:auto;
  padding-left:max(12px, env(safe-area-inset-left,0px)); }
.nav-item { position:relative; display:flex; align-items:center; gap:12px; height:56px; padding:0 16px; border-radius:var(--r-lg); color:var(--on-surface-variant); text-decoration:none; border:0; background:transparent; width:100%; cursor:pointer; text-align:left; }
.nav-item:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.nav-item .lbl { flex:1; font-family:var(--brand); font-size:14px; font-weight:600; }
.nav-item .count { font-family:var(--brand); font-size:12px; font-weight:600; }
.nav-item[aria-current="page"] { background:var(--nav-active); color:var(--on-secondary-container); }
.nav-item[aria-current="page"]::before { content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px; border-radius:0 3px 3px 0; background:var(--primary); }
.nav-section { padding:16px 16px 6px; border-top:1px solid var(--outline-variant); margin-top:8px; }
.nav-foot { margin-top:auto; padding:12px 16px 4px; }
.nav-foot a { color:var(--on-surface-variant); }
.navbar { display:none; }

.page { flex:1 1 auto; min-width:0; container-type:inline-size; container-name:page;
  padding-block:20px 48px; padding-left:max(var(--page-margin), env(safe-area-inset-left,0px)); padding-right:max(var(--page-margin), env(safe-area-inset-right,0px)); }
.page > * + * { margin-top:20px; }

/* rail 600–1199 */
@media (max-width:1199px) {
  .drawer { width:80px; padding:8px 0 12px; border-radius:0; align-items:center; padding-left:env(safe-area-inset-left,0px); }
  .nav-item { flex-direction:column; justify-content:center; gap:4px; height:auto; width:72px; padding:6px 0 8px; background:transparent !important; }
  .nav-item .sym { width:56px; height:32px; line-height:32px; text-align:center; border-radius:var(--r-lg); }
  .nav-item[aria-current="page"] .sym { background:var(--nav-active); width:56px; }
  .nav-item:hover .sym { background:color-mix(in srgb, var(--primary) 6%, transparent); }
  .nav-item[aria-current="page"]::before { left:0; top:6px; bottom:auto; height:32px; }
  .nav-item .lbl { font-size:12px; line-height:16px; text-align:center; }
  .nav-item .count, .nav-section, .nav-foot .full { display:none; }
  .user .who, .user .chev { display:none; }
}
@media (max-width:839px) { .help { display:none; } }
/* navigation bar < 600 */
@media (max-width:599px) {
  .top { height:56px; }
  .drawer, .search, .vdiv, .ask-wrap { display:none; }
  .actions { margin-left:auto; }
  .navbar { display:flex; position:fixed; left:0; right:0; bottom:0; z-index:20; height:calc(80px + env(safe-area-inset-bottom,0px)); background:var(--nav-container);
    padding:12px max(8px, env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px, env(safe-area-inset-left,0px)); justify-content:space-around; }
  .navbar .nav-item { flex-direction:column; gap:4px; height:auto; width:auto; flex:1; padding:0; background:transparent !important; }
  .navbar .nav-item .sym { width:64px; height:32px; line-height:32px; text-align:center; border-radius:var(--r-lg); }
  .navbar .nav-item[aria-current="page"] .sym { background:var(--nav-active); }
  .navbar .nav-item[aria-current="page"]::before { left:50%; top:-12px; bottom:auto; width:32px; height:3px; transform:translateX(-50%); border-radius:0 0 3px 3px; }
  .navbar .nav-item .lbl { font-size:12px; line-height:16px; flex:none; }
  .page { padding-bottom:calc(112px + env(safe-area-inset-bottom,0px)); }
}

/* ---------- page header ---------- */
.crumbs { display:flex; flex-wrap:wrap; align-items:center; gap:4px; color:var(--on-surface-variant); }
.crumbs button { border:0; background:none; padding:2px 4px; border-radius:var(--r-xs); color:var(--primary); cursor:pointer; }
.crumbs button:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.crumbs .sym { font-size:18px; }
.phead { display:flex; flex-wrap:wrap; align-items:flex-start; gap:16px; }
.phead .ttl { display:flex; gap:14px; align-items:center; min-width:0; flex:1 1 360px; }
.phead .ttl > div { min-width:0; }
.phead .meta { display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
@container page (max-width:599px) { .phead .meta { align-items:flex-start; } }
.mk { width:40px; height:40px; flex:none; }
.mk-dark { display:none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]):not(.light) .mk-dark { display:block; } :root:not([data-theme="light"]):not(.light) .mk-light { display:none; } }
:root[data-theme="dark"] .mk-dark, html.dark .mk-dark { display:block; } :root[data-theme="dark"] .mk-light, html.dark .mk-light { display:none; }

/* ---------- tabs ---------- */
.tabs { display:flex; border-bottom:1px solid var(--outline-variant); overflow-x:auto; scrollbar-width:none; }
.tab { position:relative; flex:0 0 auto; min-width:120px; height:48px; padding:0 20px; border:0; background:transparent; cursor:pointer; color:var(--on-surface-variant); display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.tab:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.tab:focus-visible { outline-offset:-3px; }
.tab[aria-selected="true"] { color:var(--primary); }
.tab[aria-selected="true"]::after { content:""; position:absolute; left:12px; right:12px; bottom:0; height:3px; border-radius:3px 3px 0 0; background:var(--primary); }
.tab .n { font-family:var(--brand); font-size:12px; font-weight:600; min-width:20px; height:20px; padding:0 6px; border-radius:9999px; background:var(--sc-highest); color:var(--on-surface-variant); line-height:20px; }
.tab[aria-selected="true"] .n { background:var(--primary-container); color:var(--on-primary-container); }

/* ---------- cards ---------- */
.card { border-radius:var(--r-md); padding:16px; min-width:0; }
.card-elev { background:var(--sc-lowest); box-shadow:var(--shadow-1); }
.card-out { background:var(--surface); border:1px solid var(--outline-variant); }
.card-fill { background:var(--sc-high); }
.card > h2 { font-family:var(--brand); font-size:16px; line-height:24px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.grid2 { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap:16px; }

/* ---------- chips ---------- */
.chips { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.chip { display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:var(--r-sm); border:1px solid var(--outline); background:transparent; color:var(--on-surface); font-family:var(--brand); font-size:14px; font-weight:500; white-space:nowrap; }
.chip .sym { font-size:18px; color:var(--on-surface-variant); }
.chip code { font-size:13px; }
button.chip { cursor:pointer; }
button.chip:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
button.chip[aria-pressed="true"] { background:var(--secondary-container); color:var(--on-secondary-container); border-color:transparent; }
button.chip[aria-pressed="true"]:hover { background:color-mix(in srgb, var(--on-secondary-container) 6%, var(--secondary-container)); }
/* StatusChip: radius-xs, state container, 18 px tile glyph (aria-hidden) + word */
.status { display:inline-flex; align-items:center; gap:6px; height:28px; padding:0 10px 0 5px; border-radius:var(--r-xs); font-family:var(--brand); font-size:12px; line-height:16px; font-weight:600; white-space:nowrap; }
.tile { width:18px; height:18px; border-radius:var(--r-xs); display:inline-grid; place-items:center; font-family:var(--plain); font-size:12px; font-weight:700; line-height:1; flex:none; }
.st-success { background:var(--success-container); color:var(--on-success-container); } .st-success .tile { background:var(--success); color:var(--on-success); }
.st-info { background:var(--primary-container); color:var(--on-primary-container); } .st-info .tile { background:var(--primary); color:var(--on-primary); }
.st-warning { background:var(--warning-container); color:var(--on-warning-container); } .st-warning .tile { background:var(--warning); color:var(--on-warning); }
.st-error { background:var(--error-container); color:var(--on-error-container); } .st-error .tile { background:var(--error); color:var(--on-error); }
.tile.solo { width:20px; height:20px; }

/* ---------- buttons ---------- */
.btn { display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 24px; border-radius:var(--r-lg); border:0; cursor:pointer; font-family:var(--brand); font-size:14px; font-weight:600; text-decoration:none; }
.btn .sym { font-size:18px; }
.btn.lead { padding-left:16px; }
.btn-text { background:transparent; color:var(--primary); padding:0 12px; }
.btn-text:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.btn-out { background:transparent; color:var(--primary); border:1px solid var(--outline); }
.btn-out:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.btn-tonal { background:var(--secondary-container); color:var(--on-secondary-container); }
.btn-tonal:hover { background:color-mix(in srgb, var(--on-secondary-container) 6%, var(--secondary-container)); }

/* ---------- chain diagram ---------- */
.legend { display:flex; flex-wrap:wrap; gap:16px; align-items:center; margin-bottom:12px; }
.legend span { display:inline-flex; align-items:center; gap:8px; }
.legend svg { width:28px; height:8px; }
.diagram-frame { overflow-x:auto; border-radius:var(--r-sm); }
/* LikeC4 view (web component) */
.lc4-head { display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; margin-bottom:12px; }
.lc4-head .legend { margin:0; }
.seg { display:inline-flex; border:1px solid var(--outline); border-radius:var(--r-lg); overflow:hidden; }
.seg button { height:40px; padding:0 16px; border:0; background:transparent; color:var(--on-surface); cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:var(--brand); font-size:14px; font-weight:600; }
.seg button + button { border-left:1px solid var(--outline); }
.seg button:hover { background:color-mix(in srgb, var(--primary) 6%, transparent); }
.seg button[aria-pressed="true"] { background:var(--secondary-container); color:var(--on-secondary-container); }
.seg button:focus-visible { outline-offset:-3px; }
.seg .sym { font-size:18px; }
.lc4-frame { position:relative; height:clamp(420px, 62vh, 640px); border:1px solid var(--outline-variant); border-radius:var(--r-md); overflow:hidden; background:var(--surface); }
.lc4-frame.small { height:clamp(300px, 42vh, 420px); }
.lc4-frame likec4-view { display:block; width:100%; height:100%; }
.lc4-hint { display:flex; align-items:center; gap:6px; margin-top:8px; }
.lc4-hint .sym { font-size:16px; }
.lc4-badge { display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 8px; border-radius:var(--r-xs); background:var(--sc-highest); color:var(--on-surface-variant); font-family:var(--brand); font-size:12px; font-weight:600; }
.chain-svg { display:block; min-width:900px; width:100%; height:auto; }
.chain-svg .col { font-family:var(--brand); font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; fill:var(--on-surface-variant); }

function statusTile(s) { if (!s) return '<span class="sr">no status</span>'; const [cls, g, w] = STATUS[s] || ["info", "i", s]; return `<span class="st-${cls}" style="background:none"><span class="tile solo" aria-hidden="true">${g}</span></span><span class="sr">${esc(w)}</span>`; }
const outcomeChip = o => o === "OK" ? `<span class="status st-success"><span class="tile" aria-hidden="true">✓</span>OK</span>` : `<span class="status st-error"><span class="tile" aria-hidden="true">✕</span>KO</span>`;
const changeChip = ch => ch ? `<span class="ax-change ${ch}"><b aria-hidden="true">${CHANGE[ch][0]}</b>${CHANGE[ch][1]}</span>` : "";
function typeName(e) { return MODEL.notation[e.kind] ? MODEL.notation[e.kind].name : (e.level === "dd" ? "DD · " + e.kind : e.level === "adr" ? "Decision record" : e.kind); }
function typeTile(e, lg) {

  return `<span class="ax-tile ax-text-tile${lg ? " lg" : ""}" title="${esc(typeName(e))}" aria-hidden="true">${SVG(e.level === "adr" ? ADR_GLYPH : DD_GLYPH)}</span>`;
}
function plateauTrack(e) {
  if (!["abb", "sbb"].includes(e.level)) return '<span class="muted">—</span>';
  return `<span class="ax-track" aria-label="In ${esc(e.plateaus.map(p => p).join(", ") || "no plateau")}">${L.plateaus.map(p =>
    `<span class="${e.plateaus.includes(p.tag) ? "on" : ""}" title="${esc(p.title)}">${PLATEAU_SHORT[p.tag] || p.tag}</span>`).join("")}</span>`;
}
const link = (id, label) => EL[id] || ARB[id] ? `<button type="button" class="lnk" data-go="${esc(id)}">${esc(label || (EL[id] || ARB[id]).title)}</button>` : `<code>${esc(id)}</code>`;

}
const byLevel = lv => MODEL.elements.filter(e => e.level === lv);

/* ---------- LikeC4 views (web component from tools/build_likec4.py; lists without it) ---------- */
const HAS_LC4 = !!(window.customElements && customElements.get("likec4-view"));
function pageIsDark() { const h = document.documentElement, t = h.dataset.theme; if (h.classList.contains("dark") || t === "dark") return true; if (h.classList.contains("light") || t === "light") return false; return matchMedia("(prefers-color-scheme: dark)").matches; }
function skinLikeC4(host, tries = 0) {
  const inner = host.shadowRoot && host.shadowRoot.querySelector(".likec4-view");
  const sr = inner && inner.shadowRoot;
  if (!sr || !sr.querySelector(".likec4-shadow-root")) { if (tries < 120) requestAnimationFrame(() => skinLikeC4(host, tries + 1)); return; }
  let st = sr.getElementById("atb-skin");
  if (!st) { st = document.createElement("style"); st.id = "atb-skin"; st.textContent = window.ATB_LC4_SKIN || ""; }
  if (sr.lastElementChild !== st) sr.appendChild(st);
  const want = pageIsDark() ? "dark" : "light";
  sr.querySelectorAll("[data-mantine-color-scheme]").forEach(n => { if (n.getAttribute("data-mantine-color-scheme") !== want) n.setAttribute("data-mantine-color-scheme", want); });
  if (!host._aitObs) { host._aitObs = new MutationObserver(() => skinLikeC4(host)); host._aitObs.observe(sr, { childList: true, subtree: true, attributes: true, attributeFilter: ["data-mantine-color-scheme"] }); }
}
function lc4(viewId, size, fallback) {
  if (!HAS_LC4) return `<div class="lc4-off">${fallback || ""}<p class="body-small muted">Interactive LikeC4 view <code>${esc(viewId)}</code>: run <code>tools/build_likec4.py</code> to embed it.</p></div>`;
  return `<div class="lc4-frame ${size || ""}"><likec4-view view-id="${esc(viewId)}" browser="true"></likec4-view></div>`;
}
const lc4Badge = v => `<span class="lc4-badge"><span class="sym" style="font-size:14px" aria-hidden="true">account_tree</span>LikeC4 · ${esc(v)}</span>`;
function mountLc4(root) { root.querySelectorAll("likec4-view").forEach(v => skinLikeC4(v)); }
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => document.querySelectorAll("likec4-view").forEach(v => skinLikeC4(v))); } catch (_) {}
new MutationObserver(() => document.querySelectorAll("likec4-view").forEach(v => skinLikeC4(v))).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "class"] });

/* ---------- routing ---------- */
const TABS = [["landscape", "Landscape"], ["blocks", "Building blocks"], ["elements", "Elements"], ["reviews", "Reviews"]];
const state = { tab: "landscape", mode: "plateau", plateau: (L.plateaus.find(p => p.tag === "target") || L.plateaus[0] || {}).tag, gap: Math.max(0, L.gaps.length - 1),
  blocksView: "index", filter: "all", q: "", detailTab: "overview", arbTab: "asd", decisions: {} };
const page = document.getElementById("page");
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (EL[h]) return renderDetail(h);
  if (ARB[h]) return renderArb(h);
  state.tab = TABS.some(t => t[0] === h) ? h : "landscape";
  renderMain();
}
function nav(hash) { if (decodeURIComponent(location.hash.slice(1)) === hash) route(); else location.hash = hash; }
function wire(root) {
  root.querySelectorAll("[data-go]").forEach(b => b.onclick = ev => { ev.preventDefault(); nav(b.dataset.go); });
  root.querySelectorAll("tr[data-go]").forEach(r => r.onkeydown = ev => { if (ev.key === "Enter") nav(r.dataset.go); });
  mountLc4(root);
}
function wireTabs(list, onSelect) {
  const tabs = [...list.querySelectorAll('[role="tab"]')];
  tabs.forEach((t, i) => {
    t.onclick = () => onSelect(t.dataset.tab);
    t.onkeydown = ev => {
      let j = null;
      if (ev.key === "ArrowRight") j = (i + 1) % tabs.length; else if (ev.key === "ArrowLeft") j = (i - 1 + tabs.length) % tabs.length;
      else if (ev.key === "Home") j = 0; else if (ev.key === "End") j = tabs.length - 1;
      if (j != null) { ev.preventDefault(); onSelect(tabs[j].dataset.tab); requestAnimationFrame(() => document.querySelector(`[role="tab"][data-tab="${tabs[j].dataset.tab}"]`)?.focus()); }
    };
  });
}
function tabsHtml(list, current, label, idp) {
  return `<div class="tabs" role="tablist" aria-label="${esc(label)}">${list.map(([id, name, n]) =>
    `<button class="tab label-large" role="tab" id="${idp}-${id}" aria-controls="${idp}-panel" aria-selected="${current === id}" tabindex="${current === id ? 0 : -1}" data-tab="${id}">${esc(name)}${n != null ? `<span class="n">${n}</span>` : ""}</button>`).join("")}</div>`;
}
const seg = (items, cur, attr, label) => `<div class="seg" role="group" aria-label="${esc(label)}">${items.map(([id, name]) =>
  `<button type="button" aria-pressed="${cur === id}" data-${attr}="${esc(id)}">${cur === id ? '<span class="sym" aria-hidden="true">check</span>' : ""}${esc(name)}</button>`).join("")}</div>`;

/* ---------- main tabs ---------- */
function pageHeader() {
  const v = MODEL.validation.summary;
  const valid = v.errors ? chip3({ x: ["error", "✕", `${v.errors} blocking ${v.errors > 1 ? "errors" : "error"}`] }, "x")
    : chip3({ x: [v.warnings ? "warning" : "success", v.warnings ? "!" : "✓", v.warnings ? `Model valid · ${v.warnings} warning${v.warnings > 1 ? "s" : ""}` : "Model valid"] }, "x");
  return `<div class="phead">
    <div class="ttl">${MARK}<div><h1 class="headline-small">Architecture</h1>
      <p class="muted" style="margin:2px 0 0">Building blocks in LikeC4 (<code>model/bb</code>), detailed design in text (<code>model/dd</code>), reviewed at the ARB. Application <code>${esc(app)}</code>.</p></div></div>
    <div class="meta">${valid}<span class="body-small muted">${v.passed} checks passed · ${MODEL.elements.length} elements · ${MODEL.arbs.length} review${MODEL.arbs.length > 1 ? "s" : ""}</span></div>

function renderMain() {

function gapTable(g, opts) {
  const items = g.items.filter(i => opts && opts.all ? true : i.change !== "unchanged")
    .sort((a, b) => ["new", "changed", "retired", "unchanged"].indexOf(a.change) - ["new", "changed", "retired", "unchanged"].indexOf(b.change) || EL[a.id].level.localeCompare(EL[b.id].level));
  if (!items.length) return `<p class="empty">No difference between these plateaus.</p>`;
  return `<div class="tbl-wrap"><div class="tbl-scroll"><table class="gap-table">
    <thead><tr><th scope="col">Building block</th><th scope="col">Change</th><th scope="col" class="p2">Level</th><th scope="col" class="p3">Plateaus</th><th scope="col" class="p2">Addressed by</th><th scope="col"><span class="sr">Status</span></th></tr></thead>
    <tbody>${items.map(i => { const e = EL[i.id]; return `<tr class="click" tabindex="0" data-go="${esc(e.id)}">
      <td><span class="cell-name">${typeTile(e)}<span><span class="nm">${esc(e.title)}</span><span class="id">${esc(typeName(e))}</span></span></span></td>
      <td>${changeChip(i.change)}</td><td class="p2">${esc(LEVEL_NAME[e.level])}</td><td class="p3">${plateauTrack(e)}</td>
      <td class="p2">${i.addressedBy.length ? i.addressedBy.map(w => `<span class="wp">${esc(EL[w].title)}${EL[w].workItemId ? ` <code>${esc(EL[w].workItemId)}</code>` : ""}</span>`).join("") : (i.change === "unchanged" ? '<span class="muted">—</span>' : '<span class="muted">not addressed</span>')}</td>

}

/* ---------- element page ---------- */
function chainUp(id) {
  const out = []; let cur = EL[id]; const seen = new Set();
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    let p = null;
    if (cur.level === "dd") p = (cur.realizes || [])[0];
    else p = (MODEL.relations.find(r => r.source === cur.id && r.kind === "realization" && EL[r.target] && ["abb", "sbb", "requirement", "motivation"].includes(EL[r.target].level)) || {}).target;
    if (!p || !EL[p]) break;
    out.unshift(EL[p]); cur = EL[p];
  }
  return out;
}
function relationsOf(id) {
  const rels = MODEL.relations.filter(r => (r.source === id || r.target === id) && EL[r.source] && EL[r.target]);
  const groups = {};
  for (const r of rels) {
    const out = r.source === id, other = out ? r.target : r.source;
    const key = `${MODEL.relationshipNames[r.kind] || r.kind}${out ? "" : " (from)"}`;
    (groups[key] = groups[key] || []).push({ e: EL[other], title: r.title });
  }

      if (r.counts.errors && b.dataset.dec !== "changes-requested") { b.setAttribute("aria-disabled", "true"); b.classList.add("is-disabled"); }
      b.onclick = () => {
        if (b.getAttribute("aria-disabled") === "true") { toast("Fix the blocking checks before approving."); return; }
        state.decisions[id] = { name: "Aurélien Heux", role: "Platform admin (you)", decision: b.dataset.dec, at: new Date().toISOString().slice(0, 10), note: p.querySelector("#dec-note").value.trim() };
        toast(`Decision recorded in this preview: ${DECISION[b.dataset.dec][2]}`); renderArb(id);
      };
    });
  }
  wire(p); wire(page.querySelector(".crumbs"));
}

/* ---------- snackbar, copy, inert shell items ---------- */
const snack = document.getElementById("snack"); let snackT;
function toast(msg) { document.getElementById("snack-msg").textContent = msg; snack.hidden = false; clearTimeout(snackT); snackT = setTimeout(() => snack.hidden = true, 4000); }
document.getElementById("snack-close").onclick = () => snack.hidden = true;
function copy(text, msg) {
  try { navigator.clipboard.writeText(text).then(() => toast(msg), () => toast("Copy is blocked here. Select the text instead.")); }
  catch (_) { toast("Copy is blocked here. Select the text instead."); }
}
document.querySelectorAll("[data-inert]").forEach(b => b.addEventListener("click", () => toast("This preview contains only the Architecture feature.")));

/* ---------- search ---------- */
const qEl = document.getElementById("q");
qEl.addEventListener("input", () => { state.q = qEl.value.trim(); state.filter = "all"; if (location.hash.slice(1) !== "elements") nav("elements"); else renderMain(); qEl.focus(); });
document.addEventListener("keydown", ev => {
  if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === "k") { ev.preventDefault(); qEl.focus(); }
  if (ev.key === "Escape" && !snack.hidden) snack.hidden = true;
});
document.getElementById("nav-count").textContent = MODEL.elements.length;
let lastHash = location.hash.slice(1);
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h !== lastHash) { state.detailTab = "overview"; if (!ARB[decodeURIComponent(h)]) state.arbTab = "asd"; }
  lastHash = h; route(); window.scrollTo(0, 0);
});
route();
try {
  const spec = '24px "Material Symbols Outlined"';
  document.fonts.load(spec).then(faces => { if (faces && faces.length) document.documentElement.classList.add("icons-ready"); }).catch(() => {});
} catch (_) {}
</script>
